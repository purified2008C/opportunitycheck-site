
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpportunityCheck - Grants Test</title>
<style>
body{font-family:Arial;margin:20px;background:#f4f7fb}
button{padding:12px;background:#176b45;color:white;border:0;border-radius:7px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:12px;border-radius:8px}
input{width:95%;padding:10px;margin:8px 0}
</style>
</head>
<body>
<h2>OpportunityCheck</h2>
<h3>Test Grants.gov Sync</h3>

<label>Supabase URL</label>
<input id="url" value="https://hkvpgxhpyhpubxdjddtm.supabase.co">

<label>Anon / Publishable Key</label>
<input id="key" placeholder="Paste your public Supabase key">

<button onclick="runTest()">Run Grants Test</button>
<pre id="out">Ready to test.</pre>

<script>
async function runTest(){
  const out=document.getElementById("out");
  out.textContent="Running...";
  try{
    const base=document.getElementById("url").value.trim().replace(/\/$/,"");
    const key=document.getElementById("key").value.trim();
    if(!key) throw Error("Enter your Supabase public key.");

    const r=await fetch(base+"/functions/v1/sync-grants",{
      method:"POST",
      headers:{
  "Content-Type":"text/plain",
  "apikey":key,
  "Authorization":"Bearer "+key
  },
      body:JSON.stringify({})
    });
    const text=await r.text();
    out.textContent="HTTP "+r.status+"\n"+text;
  }catch(e){
    out.textContent="TEST FAILED\n"+e.message;
  }
}
</script>
</body>
</html>
